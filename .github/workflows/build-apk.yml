name: Build APK

on:
  push:
    branches: [ "claude/android-3d-game-generator-hSaj5", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android-3d-game-generator/gradlew

      - name: Build Debug APK
        working-directory: android-3d-game-generator
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3DGameGenerator-debug
          path: android-3d-game-generator/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
