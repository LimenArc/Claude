[project]
name = "dailywire"
version = "0.1.0"
description = "Self-hosted daily news podcast generator: ingest, cluster, script, narrate, publish."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "trafilatura>=1.12",
    "readability-lxml>=0.8.1",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    "mutagen>=1.47",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local embeddings for clustering. Without this, dailywire falls back to TF-IDF.
embeddings = ["sentence-transformers>=3.0"]
# Local Kokoro TTS.
kokoro = ["kokoro>=0.7", "soundfile>=0.12"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
dailywire = "dailywire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dailywire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
