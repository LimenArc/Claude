<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>SysDiag</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0b0e14;
    --surface:#141823;
    --surface2:#1c2030;
    --border:#262b3d;
    --text:#e6e9f2;
    --muted:#8a90a6;
    --accent:#5b8cff;
    --accent2:#7c5cff;
    --green:#2ec27e;
    --orange:#f0883e;
    --red:#f85149;
    --yellow:#f1c40f;
  }
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font:14px/1.45 -apple-system,Roboto,"Segoe UI",sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #app{display:flex;flex-direction:column;height:100%}
  header{
    padding:14px 16px 10px;
    background:linear-gradient(180deg,#171b29,#0f1320);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  header h1{font-size:17px;font-weight:600;letter-spacing:.3px}
  header h1 span{color:var(--accent)}
  header .actions{display:flex;gap:8px}
  header button{
    background:var(--surface2);color:var(--text);border:1px solid var(--border);
    padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer
  }
  header button:active{background:#2a3046}

  nav{
    display:flex;gap:4px;padding:8px 8px 0;overflow-x:auto;
    background:#0f1320;border-bottom:1px solid var(--border);scrollbar-width:none
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto;background:transparent;color:var(--muted);border:none;
    padding:10px 14px;border-radius:8px 8px 0 0;font-size:13px;cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav button.active{color:var(--text);border-bottom-color:var(--accent);background:rgba(91,140,255,.07)}

  main{flex:1;overflow-y:auto;padding:14px;padding-bottom:32px}
  .panel{display:none}
  .panel.active{display:block}

  h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 4px 8px}
  h2:first-child{margin-top:0}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
  }
  .card.tight{padding:10px 12px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px dashed #232839}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--muted);font-size:12px;flex:1 1 auto}
  .row .v{color:var(--text);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;word-break:break-all;max-width:60%}
  .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
  .stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .stat .value{font-size:20px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat .sub{font-size:11px;color:var(--muted);margin-top:2px}

  .bar{position:relative;height:8px;background:#1a1f2e;border-radius:4px;overflow:hidden;margin-top:6px}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .3s}
  .bar.ok > span{background:linear-gradient(90deg,#1a8a5c,var(--green))}
  .bar.warn > span{background:linear-gradient(90deg,#a85a17,var(--orange))}
  .bar.danger > span{background:linear-gradient(90deg,#a4242a,var(--red))}

  .core{display:flex;align-items:center;gap:8px;padding:6px 0}
  .core .idx{width:36px;color:var(--muted);font-size:12px}
  .core .freq{width:90px;font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
  .core .bar{flex:1}
  .core .gov{width:74px;font-size:11px;color:var(--muted);text-align:right}

  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--surface2);color:var(--text);border:1px solid var(--border);margin:2px 2px 0 0}
  .pill.green{background:rgba(46,194,126,.15);border-color:rgba(46,194,126,.4);color:#7adfb1}
  .pill.red{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.35);color:#f49a96}
  .pill.warn{background:rgba(240,136,62,.12);border-color:rgba(240,136,62,.35);color:#f5b885}
  .pill.blue{background:rgba(91,140,255,.12);border-color:rgba(91,140,255,.4);color:#a8c0ff}

  button.primary{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#fff;border:none;padding:11px 16px;border-radius:10px;
    font-size:13px;font-weight:600;cursor:pointer;width:100%;
  }
  button.primary:disabled{opacity:.55}
  button.ghost{
    background:var(--surface2);color:var(--text);border:1px solid var(--border);
    padding:9px 12px;border-radius:8px;font-size:12px;cursor:pointer;
  }

  .bench-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
  .bench-row:last-child{border:none}
  .bench-row .info{flex:1}
  .bench-row .info b{display:block;margin-bottom:2px}
  .bench-row .info span{color:var(--muted);font-size:12px}
  .bench-row .score{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--green);min-width:96px;text-align:right}
  .bench-row .score.pending{color:var(--muted);font-weight:400;font-size:13px}

  .sensor{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #232839;gap:8px}
  .sensor:last-child{border:none}
  .sensor .n{flex:1;font-size:13px}
  .sensor .v{color:var(--muted);font-size:11px;text-align:right}

  pre.report{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;color:#cbd2e8;background:#0a0d15;border:1px solid var(--border);
    border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-all;
    max-height:55vh;overflow:auto;
  }

  .spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .toast{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    background:#1d2436;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;
    border:1px solid var(--border);opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1}

  /* ─── Matrix sensor panel ─── */
  #panel-sensors{margin:-14px;padding:0;background:#000;min-height:calc(100vh - 96px)}
  .matrix-wrap{position:relative;background:#000;color:#00ff5a;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:calc(100vh - 96px)}
  .matrix-wrap canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
  .matrix-content{position:relative;z-index:2;padding:14px 12px 28px}

  .matrix-header{font-size:12px;letter-spacing:1px;margin-bottom:6px;text-shadow:0 0 6px #0f0}
  .matrix-prompt{color:#39ff7e;margin-right:6px}
  .matrix-cmd{color:#a8ffc4}
  .matrix-blink{color:#0f0;animation:blk 1s steps(2) infinite;margin-left:2px}
  @keyframes blk{50%{opacity:0}}
  .matrix-stats{display:flex;gap:14px;font-size:11px;color:#39ff7e;margin-bottom:14px;border-bottom:1px dashed rgba(0,255,90,.25);padding-bottom:8px;text-shadow:0 0 3px #0f0}
  .matrix-stats b{color:#bfffd0;font-weight:600}

  .matrix-grid{display:grid;grid-template-columns:1fr;gap:8px}
  @media(min-width:560px){.matrix-grid{grid-template-columns:1fr 1fr}}
  @media(min-width:880px){.matrix-grid{grid-template-columns:1fr 1fr 1fr}}

  .mcell{
    background:rgba(0,16,4,0.72);
    border:1px solid rgba(0,255,90,.35);
    border-radius:4px;padding:8px 10px 10px;
    box-shadow:inset 0 0 12px rgba(0,255,90,.06);
    transition:border-color .2s, box-shadow .2s;
  }
  .mcell.active{border-color:rgba(0,255,90,.7);box-shadow:inset 0 0 18px rgba(0,255,90,.12),0 0 8px rgba(0,255,90,.18)}
  .mhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:1px}
  .mname{color:#bfffd0;font-weight:600;text-shadow:0 0 4px #0f0}
  .mhz{color:#39ff7e;font-size:11px;font-variant-numeric:tabular-nums}
  .mmeta{display:flex;justify-content:space-between;font-size:10px;color:rgba(0,255,90,.65);margin-top:2px;letter-spacing:.5px}
  .macc{font-weight:600}
  .macc.acc0{color:#ff5959}
  .macc.acc1{color:#ffb454}
  .macc.acc2{color:#9aff7d}
  .macc.acc3{color:#bfffd0}
  .mvendor{font-size:10px;color:rgba(0,255,90,.45);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .maxes{margin-top:8px;display:flex;flex-direction:column;gap:2px}
  .mrow{display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
  .mlabel{width:24px;color:#39ff7e;font-weight:600}
  .mval{width:74px;color:#bfffd0;text-align:right;text-shadow:0 0 3px #0f0}
  .mbar{flex:1;color:#0f0;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-shadow:0 0 4px rgba(0,255,90,.6)}

  .matrix-footer{margin-top:14px}
  .matrix-hbar{height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,90,.5),transparent);margin-bottom:10px}
  .matrix-features{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .mflabel{font-size:10px;color:rgba(0,255,90,.55);width:100%;letter-spacing:1px;margin-bottom:4px}
  .mfpill{
    display:inline-block;font-size:10px;padding:2px 6px;
    border:1px solid rgba(0,255,90,.35);color:rgba(180,255,200,.85);
    border-radius:2px;background:rgba(0,40,16,0.4);
  }
  .mfpill.on{border-color:rgba(120,255,170,.8);color:#bfffd0;text-shadow:0 0 3px #0f0}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span>◆</span> SysDiag</h1>
    <div class="actions">
      <button id="refreshBtn">Refresh</button>
    </div>
  </header>
  <nav id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="cpu">CPU</button>
    <button data-tab="memory">Memory</button>
    <button data-tab="battery">Battery &amp; Thermal</button>
    <button data-tab="display">Display &amp; GPU</button>
    <button data-tab="sensors">Sensors</button>
    <button data-tab="network">Network</button>
    <button data-tab="benchmark">Benchmark</button>
    <button data-tab="report">Report</button>
  </nav>
  <main>
    <div class="panel active" id="panel-overview"></div>
    <div class="panel" id="panel-cpu"></div>
    <div class="panel" id="panel-memory"></div>
    <div class="panel" id="panel-battery"></div>
    <div class="panel" id="panel-display"></div>
    <div class="panel" id="panel-sensors"></div>
    <div class="panel" id="panel-network"></div>
    <div class="panel" id="panel-benchmark"></div>
    <div class="panel" id="panel-report"></div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
"use strict";

// ─── Bridge wrapper (with mock fallback for previewing on desktop) ──────────
const N = (function(){
  if (window.Native) return window.Native;
  // Mock for browser preview
  const mock = {
    getOverview: () => JSON.stringify({device:"Preview Device",brand:"Mock",product:"x",board:"y",hardware:"z",
      androidRelease:"15",sdkInt:35,codename:"REL",incremental:"123",securityPatch:"2026-04-01",
      bootloader:"unknown",fingerprint:"mock/preview/x:15/AB/123:user/release-keys",
      kernel:"6.1.0-mock",uptimeMs:1234567,locale:"en_US",timezone:"UTC"}),
    getCpu: () => JSON.stringify({cores:8,supportedAbis:["arm64-v8a"],supported32:["armeabi-v7a"],supported64:["arm64-v8a"],
      arch:"aarch64",hardware:"Mock SoC",processor:"AArch64",features:"fp asimd",
      perCore:Array.from({length:8},(_,i)=>({index:i,cur:1500000+i*200000,min:300000,max:2800000,governor:"schedutil",driver:"qcom"})),
      loadavg:"0.42 0.38 0.30 1/345 6789"}),
    getMemory: () => JSON.stringify({totalRam:8e9,availRam:3.5e9,usedRam:4.5e9,threshold:2e8,lowMemory:false,
      memTotal:8e9,memFree:1.2e9,memAvail:3.5e9,buffers:5e7,cached:2.3e9,swapTotal:2e9,swapFree:1e9,swapCached:1e7,vmallocTotal:0,
      storage:[{label:"Internal /data",path:"/data",total:128e9,free:46e9,used:82e9}],
      heap:{max:5.36e8,total:6e7,free:2e7,used:4e7,nativeAlloc:1.5e7,nativeSize:2e7,nativeFree:5e6}}),
    getBattery: () => JSON.stringify({percent:78.0,level:78,scale:100,status:"Discharging",plugged:"On battery",
      health:"Good",temperatureC:32.4,voltageV:4.123,technology:"Li-ion",
      currentNowUA:-450000,currentAvgUA:-420000,capacityPct:78,chargeCounterUAh:3500000,
      thermalZones:[{zone:"thermal_zone0",type:"cpu-thermal",tempC:42.3},{zone:"thermal_zone1",type:"battery",tempC:32.5}]}),
    getDisplay: () => JSON.stringify({widthPx:1080,heightPx:2400,density:2.75,densityDpi:440,xdpi:401,ydpi:401,
      scaledDensity:2.75,refreshRate:120,rotation:0,name:"Mock",
      modes:[{id:1,w:1080,h:2400,hz:60},{id:2,w:1080,h:2400,hz:120}],
      gpu:{renderer:"Adreno (Mock)",vendor:"Qualcomm",version:"OpenGL ES 3.2",extensions:"GL_EXT_..."},
      nightMode:true,fontScale:1.0}),
    getSensors: () => JSON.stringify([
      {name:"Mock Accel",vendor:"Mock",type:"android.sensor.accelerometer",typeId:1,version:1,power:0.13,range:39.2,resolution:0.01,minDelayUs:5000},
      {name:"Mock Gyro",vendor:"Mock",type:"android.sensor.gyroscope",typeId:4,version:1,power:0.5,range:34.9,resolution:0.001,minDelayUs:5000}
    ]),
    readSensorOnce: () => JSON.stringify({values:[0.01,0.02,9.81,0,0,0],ok:true}),
    getNetwork: () => JSON.stringify({downstreamKbps:50000,upstreamKbps:5000,wifi:true,cellular:false,ethernet:false,vpn:false,validated:true,metered:false,
      interface:"wlan0",dns:["1.1.1.1","8.8.8.8"],
      wifi:{enabled:true,rssi:-52,linkSpeedMbps:433,frequencyMhz:5180,ssid:"\"PreviewNet\"",bssid:"00:11:22:33:44:55",hiddenSsid:false,standard:6},
      telephony:{operator:"",country:"us",simState:1,phoneType:0},
      interfaces:[{name:"wlan0",display:"wlan0",up:true,loopback:false,mtu:1500,addresses:["192.168.1.42"]}],
      bluetooth:{present:true,enabled:false,name:"Phone"}}),
    getFeatures: () => JSON.stringify({features:["android.hardware.wifi","android.hardware.bluetooth_le","android.hardware.camera","android.hardware.fingerprint"],
      appsInstalled:142,locationProviders:["gps","network","fused"]}),
    benchmarkCpuInt: (ms) => { const start=performance.now(); let x=12345n; let ops=0;
      while(performance.now()-start<ms){ for(let i=0;i<4096;i++){ x = (x ^ (x<<13n)) & 0xffffffffffffffffn; } ops+=4096; }
      return JSON.stringify({ops,ms,checksum:Number(x)}); },
    benchmarkCpuFloat: (ms) => { const start=performance.now(); let c=0; let ops=0;
      while(performance.now()-start<ms){ for(let i=0;i<4096;i++){ c = Math.sqrt(c*c+1); } ops+=4096; }
      return JSON.stringify({ops,ms,checksum:c}); },
    benchmarkMemory: (mb,it) => JSON.stringify({mbPerSec:8500,bytes:mb*1048576*it,ns:1e9,checksum:0})
  };
  return mock;
})();

// ─── Helpers ─────────────────────────────────────────────────────────────
const $ = sel => document.querySelector(sel);
const fmtBytes = n => {
  if (n == null || isNaN(n)) return "—";
  const u = ["B","KiB","MiB","GiB","TiB"]; let i = 0; let v = Number(n);
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return v.toFixed(v < 10 && i > 0 ? 2 : 1) + " " + u[i];
};
const fmtHz = khz => {
  if (khz == null) return "—";
  const v = Number(khz);
  if (v >= 1e6) return (v/1e6).toFixed(2) + " GHz";
  if (v >= 1e3) return (v/1e3).toFixed(0) + " MHz";
  return v + " kHz";
};
const fmtUptime = ms => {
  if (!ms) return "—";
  let s = Math.floor(ms/1000);
  const d = Math.floor(s/86400); s -= d*86400;
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return (d?`${d}d `:"") + `${h}h ${m}m ${s}s`;
};
const escape = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const row = (k,v,mono) => `<div class="row"><div class="k">${escape(k)}</div><div class="v ${mono?"mono":""}">${v??"—"}</div></div>`;

function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 1800);
}

// ─── Tabs ────────────────────────────────────────────────────────────────
const renderers = {};
let currentTab = "overview";
function activate(tab) {
  if (currentTab === "sensors" && tab !== "sensors") leaveSensors();
  currentTab = tab;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab===tab));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id==="panel-"+tab));
  if (renderers[tab]) renderers[tab]();
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => activate(b.dataset.tab)));

// ─── Cache last-snapshot data for the report ─────────────────────────────
const snapshot = {};

// ─── Overview ───────────────────────────────────────────────────────────
renderers.overview = () => {
  const o = JSON.parse(N.getOverview()); snapshot.overview = o;
  const m = JSON.parse(N.getMemory()); snapshot.memory = m;
  const b = JSON.parse(N.getBattery()); snapshot.battery = b;
  const cpu = JSON.parse(N.getCpu()); snapshot.cpu = cpu;

  const ramPct = m.totalRam ? (m.usedRam / m.totalRam * 100) : 0;
  const storage0 = (m.storage||[])[0] || {};
  const stoPct = storage0.total ? ((storage0.total - storage0.free)/storage0.total*100) : 0;
  const battPct = b.percent != null ? b.percent : 0;
  const battCls = battPct < 20 ? "danger" : battPct < 50 ? "warn" : "ok";

  $("#panel-overview").innerHTML = `
    <div class="grid2">
      <div class="stat">
        <div class="label">Device</div>
        <div class="value" style="font-size:15px">${escape(o.device)}</div>
        <div class="sub">Android ${escape(o.androidRelease)} · API ${o.sdkInt}</div>
      </div>
      <div class="stat">
        <div class="label">CPU</div>
        <div class="value" style="font-size:15px">${escape(cpu.hardware || cpu.processor || "Unknown")}</div>
        <div class="sub">${cpu.cores} cores · ${escape((cpu.supportedAbis||[])[0]||"")}</div>
      </div>
      <div class="stat">
        <div class="label">RAM</div>
        <div class="value">${fmtBytes(m.usedRam)} / ${fmtBytes(m.totalRam)}</div>
        <div class="bar ${ramPct>85?"danger":ramPct>65?"warn":""}"><span style="width:${ramPct.toFixed(1)}%"></span></div>
      </div>
      <div class="stat">
        <div class="label">Storage</div>
        <div class="value">${fmtBytes(storage0.total - storage0.free)} / ${fmtBytes(storage0.total)}</div>
        <div class="bar ${stoPct>90?"danger":stoPct>75?"warn":""}"><span style="width:${stoPct.toFixed(1)}%"></span></div>
      </div>
      <div class="stat">
        <div class="label">Battery</div>
        <div class="value">${battPct.toFixed(0)}%</div>
        <div class="bar ${battCls}"><span style="width:${battPct.toFixed(1)}%"></span></div>
        <div class="sub">${escape(b.status)} · ${b.temperatureC?b.temperatureC.toFixed(1)+"°C":"—"}</div>
      </div>
      <div class="stat">
        <div class="label">Uptime</div>
        <div class="value" style="font-size:15px">${fmtUptime(o.uptimeMs)}</div>
        <div class="sub">${escape(o.timezone)}</div>
      </div>
    </div>

    <h2>Build</h2>
    <div class="card">
      ${row("Brand", escape(o.brand))}
      ${row("Product", escape(o.product))}
      ${row("Board", escape(o.board))}
      ${row("Hardware", escape(o.hardware))}
      ${row("Bootloader", escape(o.bootloader))}
      ${row("Kernel", escape(o.kernel), true)}
      ${row("Security patch", escape(o.securityPatch))}
      ${row("Codename", escape(o.codename))}
      ${row("Build incremental", escape(o.incremental), true)}
      ${row("Fingerprint", escape(o.fingerprint), true)}
      ${row("Locale", escape(o.locale))}
    </div>
  `;
};

// ─── CPU ────────────────────────────────────────────────────────────────
renderers.cpu = () => {
  const c = JSON.parse(N.getCpu()); snapshot.cpu = c;
  const cores = c.perCore || [];
  const overallMax = Math.max(1, ...cores.map(x=>x.max||0));
  const features = (c.features || "").split(/\s+/).filter(Boolean);

  $("#panel-cpu").innerHTML = `
    <h2>Processor</h2>
    <div class="card">

let sensorList = [];

function blockBar(value, scale, base, useLog, width) {
  width = width || 16;
  let v;
  if (useLog) v = value > 0 ? Math.log10(value+1) / Math.log10(scale+1) : 0;
  else if (base != null) v = (value - base) / (scale - base);
  else v = (Math.abs(value) || 0) / scale;
  v = Math.max(0, Math.min(1, v));
  const filled = Math.round(v * width);
  return "█".repeat(filled) + "░".repeat(width - filled);
}

function startSensorPoll() {
  stopSensorPoll();
  let frame = 0;
  const update = () => {
    frame++;
    let data;
    try { data = JSON.parse(N.pollStream()); } catch(e) { return; }
    const fc = $("#frameCount"); if (fc) fc.textContent = String(frame);

    sensorList.forEach(s => {
      const tid = s.typeId;
      const cell = document.querySelector(`.mcell[data-tid="${tid}"]`);
      if (!cell) return;
      const ev = data[tid];
      if (!ev) return;
      const meta = SENSOR_AXES[tid] || {axes:["?"], scale:1};

      // Rate (Hz) — keep last 8 timestamps
      if (ev.t != null) {
        const w = sensorRateWindow[tid] = sensorRateWindow[tid] || [];
        w.push(ev.t);
        if (w.length > 8) w.shift();
        if (w.length >= 2) {
          const dt = (w[w.length-1] - w[0]) / 1e9;
          const hz = (w.length-1) / dt;
          const hzEl = document.getElementById("hz-"+tid);
          if (hzEl) hzEl.textContent = (hz>=1?hz.toFixed(0):hz.toFixed(1)) + " Hz";
        }
      }

      // Accuracy
      if (ev.a != null) {
        const accEl = document.getElementById("acc-"+tid);
        if (accEl) {
          accEl.textContent = ACCURACY_NAMES[ev.a] || ("ACC "+ev.a);
          accEl.className = "macc acc"+ev.a;
        }
      }

      // Values
      const rows = cell.querySelectorAll(".mrow");
      const vals = ev.v || [];
      rows.forEach((r, i) => {
        const v = vals[i] != null ? vals[i] : 0;
        const valEl = r.querySelector(".mval");
        const barEl = r.querySelector(".mbar");
        if (valEl) valEl.textContent = (v>=0?"+":"") + v.toFixed(3);
        if (barEl) barEl.textContent = blockBar(v, meta.scale, meta.base, meta.log, 16);
      });

      cell.classList.add("active");
    });
  };
  sensorPollTimer = setInterval(update, 80);
}

function stopSensorPoll() {
  if (sensorPollTimer) { clearInterval(sensorPollTimer); sensorPollTimer = null; }
  sensorRateWindow = {};
}

function leaveSensors() {
  stopSensorPoll();
  stopMatrixRain();
  try { N.stopStream(); } catch(e){}
}

function startMatrixRain() {
  const c = document.getElementById("rainCanvas");
  if (!c) return;
  const ctx = c.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const fit = () => {
    const r = c.getBoundingClientRect();
    c.width  = Math.floor(r.width * dpr);
    c.height = Math.floor(r.height * dpr);
  };
  fit();
  const fontSize = 14 * dpr;
  const cols = Math.floor(c.width / fontSize);
  const drops = new Array(cols).fill(0).map(() => Math.random() * c.height / fontSize);
  const glyphs = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎ0123456789ABCDEF<>{}[]/\\=*-+|";

  let last = 0;
  const draw = (now) => {
    if (!rainHandle) return;
    if (now - last >= 60) {
      ctx.fillStyle = "rgba(0,8,2,0.18)";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.font = fontSize + "px ui-monospace, Menlo, monospace";
      for (let i = 0; i < drops.length; i++) {
        const ch = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
        const x = i * fontSize;
        const y = drops[i] * fontSize;
        ctx.fillStyle = Math.random() < 0.04 ? "rgba(180,255,200,0.95)" : "rgba(0,255,90,0.55)";
        ctx.fillText(ch, x, y);
        if (y > c.height && Math.random() > 0.97) drops[i] = 0;
        drops[i] += 1;
      }
      last = now;
    }
    rainHandle = requestAnimationFrame(draw);
  };
  rainHandle = requestAnimationFrame(draw);
}

function stopMatrixRain() {
  if (rainHandle) { cancelAnimationFrame(rainHandle); rainHandle = null; }
}

// ─── Benchmark ───────────────────────────────────────────────────────────
const benchState = {int:null, float:null, mem:null};

function runBench(kind) {
  const card = $("#bench-"+kind);
  const score = card.querySelector(".score");
  score.classList.add("pending");
  score.innerHTML = '<span class="spinner"></span>running…';
  setTimeout(() => {
    let r;
    try {
      if (kind === "int") r = JSON.parse(N.benchmarkCpuInt(2000));
      else if (kind === "float") r = JSON.parse(N.benchmarkCpuFloat(2000));
      else r = JSON.parse(N.benchmarkMemory(16, 4));
    } catch(e) { score.textContent = "error"; return; }
    benchState[kind] = r;
    score.classList.remove("pending");
    if (kind === "int") score.textContent = (r.ops/r.ms/1000).toFixed(1) + " Mop/s";
    else if (kind === "float") score.textContent = (r.ops/r.ms/1000).toFixed(1) + " Mflop/s";
    else score.textContent = (r.mbPerSec||0).toFixed(0) + " MB/s";
    snapshot.benchmark = benchState;
    toast("Benchmark complete");
  }, 30);
}

renderers.benchmark = () => {
  $("#panel-benchmark").innerHTML = `
    <h2>Benchmarks</h2>
    <div class="card">
      <div class="bench-row" id="bench-int">
        <div class="info"><b>Integer throughput</b><span>2 s xorshift loop · single-core</span></div>
        <div class="score pending">—</div>
      </div>
      <div class="bench-row" id="bench-float">
        <div class="info"><b>Floating-point</b><span>2 s sqrt + FMA loop · single-core</span></div>
        <div class="score pending">—</div>
      </div>
      <div class="bench-row" id="bench-mem">
        <div class="info"><b>Memory bandwidth</b><span>64 MB sequential read</span></div>
        <div class="score pending">—</div>
      </div>
    </div>
    <div class="card">
      <button class="primary" id="benchAll">Run all benchmarks</button>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="ghost" data-b="int" style="flex:1">Integer</button>
        <button class="ghost" data-b="float" style="flex:1">Float</button>
        <button class="ghost" data-b="mem" style="flex:1">Memory</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">
        Higher is better. Results vary with thermal throttling and other system load.
      </div>
    </div>
  `;
  $("#benchAll").addEventListener("click", () => {
    runBench("int");
    setTimeout(()=>runBench("float"), 2200);
    setTimeout(()=>runBench("mem"), 4500);
  });
  document.querySelectorAll('#panel-benchmark [data-b]').forEach(b =>
    b.addEventListener("click", () => runBench(b.dataset.b)));
};

// ─── Report ─────────────────────────────────────────────────────────────
renderers.report = () => {
  $("#panel-report").innerHTML = `
    <h2>System report</h2>
    <div class="card">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="primary" id="genReport" style="flex:2">Generate full report</button>
        <button class="ghost" id="copyReport" style="flex:1">Copy</button>
      </div>
      <pre class="report" id="reportOut">Tap "Generate full report" to capture every metric in plain text.</pre>
    </div>
  `;
  $("#genReport").addEventListener("click", generateReport);
  $("#copyReport").addEventListener("click", () => {
    const t = $("#reportOut").textContent;
    if (!t) return;
    try { navigator.clipboard.writeText(t); toast("Copied to clipboard"); }
    catch(e) {
      const ta = document.createElement("textarea");
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Copied"); } catch(_) { toast("Copy failed"); }
      document.body.removeChild(ta);
    }
  });
};

function generateReport() {
  // Force-refresh every section
  snapshot.overview = JSON.parse(N.getOverview());
  snapshot.cpu = JSON.parse(N.getCpu());
  snapshot.memory = JSON.parse(N.getMemory());
  snapshot.battery = JSON.parse(N.getBattery());
  snapshot.display = JSON.parse(N.getDisplay());
  snapshot.sensors = JSON.parse(N.getSensors());
  snapshot.network = JSON.parse(N.getNetwork());
  snapshot.features = JSON.parse(N.getFeatures());

  const o = snapshot.overview, c = snapshot.cpu, m = snapshot.memory, b = snapshot.battery,
        d = snapshot.display, s = snapshot.sensors, n = snapshot.network, f = snapshot.features;

  let out = "";
  const line = (k,v) => { out += k.padEnd(28) + " " + (v??"—") + "\n"; };
  const head = h => out += "\n══ " + h + " " + "═".repeat(Math.max(0,46-h.length)) + "\n";

  out += "SysDiag report — " + new Date().toISOString() + "\n";
  out += "═".repeat(54) + "\n";

  head("Device");
  line("Model", o.device);
  line("Brand / product", o.brand + " / " + o.product);
  line("Board / hardware", o.board + " / " + o.hardware);
  line("Android", o.androidRelease + " (API " + o.sdkInt + ")");
  line("Security patch", o.securityPatch);
  line("Bootloader", o.bootloader);
  line("Kernel", o.kernel);
  line("Build incremental", o.incremental);
  line("Fingerprint", o.fingerprint);
  line("Locale / timezone", o.locale + " / " + o.timezone);
  line("Uptime", fmtUptime(o.uptimeMs));

  head("CPU");
  line("Cores", c.cores);
  line("Architecture", c.arch);
  line("Hardware", c.hardware);
  line("Processor", c.processor);
  line("ABIs", (c.supportedAbis||[]).join(", "));
  line("Load average", c.loadavg);
  line("Features", c.features);
  out += "  Per-core:\n";
  (c.perCore||[]).forEach(cc => {
    out += "    CPU" + cc.index + "  cur=" + fmtHz(cc.cur) + "  max=" + fmtHz(cc.max) +
           "  gov=" + (cc.governor||"?") + "\n";
  });

  head("Memory");
  line("RAM total", fmtBytes(m.totalRam));
  line("RAM used", fmtBytes(m.usedRam));
  line("RAM available", fmtBytes(m.availRam));
  line("Buffers / cached", fmtBytes(m.buffers) + " / " + fmtBytes(m.cached));
  line("Swap total / free", fmtBytes(m.swapTotal) + " / " + fmtBytes(m.swapFree));
  out += "  Storage:\n";
  (m.storage||[]).forEach(st => {
    out += "    " + (st.label||"?").padEnd(28) + " " + fmtBytes(st.total-st.free) + " / " + fmtBytes(st.total) + "\n";
  });

  head("Battery & Thermal");
  line("Charge", (b.percent||0).toFixed(1) + "%");
  line("Status", b.status + " (" + b.plugged + ")");
  line("Health", b.health);
  line("Technology", b.technology);
  line("Voltage", b.voltageV ? b.voltageV.toFixed(3)+" V" : "—");
  line("Temperature", b.temperatureC ? b.temperatureC.toFixed(1)+" °C" : "—");
  if (b.currentNowUA != null) line("Current draw", (b.currentNowUA/1000).toFixed(0) + " mA");
  if (b.chargeCounterUAh) line("Charge counter", (b.chargeCounterUAh/1000).toFixed(0) + " mAh");
  out += "  Thermal zones:\n";
  (b.thermalZones||[]).forEach(z => {
    out += "    " + (z.type||z.zone).padEnd(28) + " " + (z.tempC!=null?z.tempC.toFixed(1)+" °C":"—") + "\n";
  });

  head("Display & GPU");
  line("Resolution", d.widthPx + "×" + d.heightPx + " @ " + (d.refreshRate||0).toFixed(1) + " Hz");
  line("Density", d.densityDpi + " dpi (×" + d.density + ")");
  line("GPU renderer", d.gpu.renderer);
  line("GPU vendor", d.gpu.vendor);
  line("GL version", d.gpu.version);

  head("Network");
  line("Interface", n.interface);
  if (n.wifi) {
    line("Wi-Fi SSID", n.wifi.ssid);
    line("Wi-Fi RSSI", n.wifi.rssi!=null?n.wifi.rssi+" dBm":"—");
    line("Wi-Fi link", n.wifi.linkSpeedMbps?n.wifi.linkSpeedMbps+" Mbps":"—");
    line("Wi-Fi freq", n.wifi.frequencyMhz?(n.wifi.frequencyMhz/1000).toFixed(2)+" GHz":"—");
  }
  line("Validated", n.validated?"Yes":"No");
  line("Metered", n.metered?"Yes":"No");
  line("DNS", (n.dns||[]).join(", "));
  out += "  Interfaces:\n";
  (n.interfaces||[]).forEach(i => {
    out += "    " + (i.name + (i.up?" (up)":" (down)")).padEnd(28) +
           " " + (i.addresses||[]).join(", ") + "\n";
  });

  head("Sensors (" + (s||[]).length + ")");
  (s||[]).forEach(sn => {
    out += "  " + (sn.name||"?").padEnd(34) + " " + (sn.type||"").replace("android.sensor.","") + "\n";
  });

  if (snapshot.benchmark) {
    head("Benchmarks");
    const bm = snapshot.benchmark;
    if (bm.int) line("Integer", (bm.int.ops/bm.int.ms/1000).toFixed(1) + " Mop/s");
    if (bm.float) line("Float", (bm.float.ops/bm.float.ms/1000).toFixed(1) + " Mflop/s");
    if (bm.mem) line("Memory bandwidth", (bm.mem.mbPerSec||0).toFixed(0) + " MB/s");
  }

  head("Hardware features");
  out += "  " + (f.features||[]).map(x=>x.replace("android.hardware.","")).join(", ") + "\n";

  $("#reportOut").textContent = out;
  toast("Report ready · " + out.length + " chars");
}

// ─── Refresh ────────────────────────────────────────────────────────────
$("#refreshBtn").addEventListener("click", () => {
  const tab = document.querySelector("nav button.active").dataset.tab;
  if (renderers[tab]) renderers[tab]();
  toast("Refreshed");
});

// ─── Initial render ─────────────────────────────────────────────────────
renderers.overview();
</script>
</body>
</html>
