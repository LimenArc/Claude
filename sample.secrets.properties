# Copy this file to secrets.properties and fill in your values.
# secrets.properties is git-ignored and must never be committed.

# From your Azure App Registration → Overview
CLIENT_ID=00000000-0000-0000-0000-000000000000

# Must match the redirect URI registered in Azure (MSAL broker format)
# Format: msauth://<package_name>/<base64_url_encoded_signature_hash>
REDIRECT_URI=msauth://com.example.onedrivestreamer/YOUR_BASE64_SIGNATURE_HASH
