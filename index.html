<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Model Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242736;
      --border: #2e3147;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --user-bg: #1e2d4a;
      --assistant-bg: #1a1d27;
      --error: #ef4444;
      --green: #22c55e;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow-y: auto;
    }

    #sidebar h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      padding: 4px 0 8px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar h2 {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-top: 4px;
    }

    /* model cards */
    .model-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .model-card:hover { border-color: var(--accent-hover); }
    .model-card.active {
      border-color: var(--accent);
      background: #1e2140;
    }
    .model-card .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      margin-top: 5px;
      flex-shrink: 0;
      transition: background .15s;
    }
    .model-card.active .dot { background: var(--accent); }
    .model-card .info { flex: 1; min-width: 0; }
    .model-card .name { font-size: 13px; font-weight: 600; color: var(--text); }
    .model-card .desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* new chat btn */
    #new-chat-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background .15s;
    }
    #new-chat-btn:hover { background: var(--accent-hover); }

    /* system prompt */
    #system-prompt {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      color: var(--text);
      font-size: 12px;
      resize: vertical;
      width: 100%;
      min-height: 72px;
      font-family: inherit;
    }
    #system-prompt:focus { outline: none; border-color: var(--accent); }

    /* cache toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: background .2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(16px); }

    /* ── Chat area ── */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* header */
    #chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
    }
    #chat-header .model-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-hover);
    }
    #usage-bar {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }
    #usage-bar span { white-space: nowrap; }
    #usage-bar .hit { color: var(--green); }

    /* messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 820px;
      align-self: flex-start;
      width: 100%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg.user .avatar { background: var(--accent); color: #fff; }
    .msg.assistant .avatar { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

    .bubble {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-color: #2a3f5c;
    }
    .bubble .model-tag {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    /* streaming cursor */
    .cursor::after {
      content: '▋';
      animation: blink .7s step-end infinite;
      color: var(--accent);
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* empty state */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 8px;
      text-align: center;
    }
    #empty-state .icon { font-size: 40px; opacity: .4; }
    #empty-state p { font-size: 14px; }

    /* input row */
    #input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #msg-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 160px;
      overflow-y: auto;
      line-height: 1.5;
    }
    #msg-input:focus { outline: none; border-color: var(--accent); }
    #msg-input::placeholder { color: var(--text-muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      width: 40px; height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; }

    /* error toast */
    #error-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--error);
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 13px;
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <h1>Multi-Model Chat</h1>
  <button id="new-chat-btn" onclick="newChat()">+ New Chat</button>

  <h2>Models</h2>
  <div id="model-list"></div>

  <h2>System Prompt</h2>
  <textarea id="system-prompt" placeholder="Optional system prompt…"></textarea>

  <div class="toggle-row">
    <span>Prompt Caching</span>
    <label class="toggle">
      <input type="checkbox" id="cache-toggle" checked />
      <span class="slider"></span>
    </label>
  </div>
</aside>

<!-- Chat -->
<section id="chat-area">
  <div id="chat-header">
    <span class="model-badge" id="active-model-label">No model selected</span>
    <div id="usage-bar" style="display:none">
      <span id="u-in">In: –</span>
      <span id="u-out">Out: –</span>
      <span id="u-cached" class="hit" style="display:none">Cache hit: –</span>
    </div>
  </div>

  <div id="messages">
    <div id="empty-state">
      <div class="icon">💬</div>
      <p>Select a model and start chatting</p>
    </div>
  </div>

  <div id="input-area">
    <textarea id="msg-input" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
      rows="1" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</section>

<div id="error-toast"></div>

<script>
let models = [];
let selectedModel = null;
let messages = [];       // {role, content, modelId}
let isStreaming = false;

// ── Init ──────────────────────────────────────────────
async function init() {
  const res = await fetch('/api/models');
  models = await res.json();
  renderModels();
  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
}

function renderModels() {
  const list = document.getElementById('model-list');
  list.innerHTML = models.map(m => `
    <div class="model-card ${selectedModel === m.id ? 'active' : ''}" onclick="selectModel('${m.id}')">
      <div class="dot"></div>
      <div class="info">
        <div class="name">${m.name}</div>
        <div class="desc">${m.description}</div>
      </div>
    </div>`).join('');
}

function selectModel(id) {
  selectedModel = id;
  renderModels();
  const m = models.find(x => x.id === id);
  document.getElementById('active-model-label').textContent = m ? m.name : id;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}

function newChat() {
  messages = [];
  document.getElementById('messages').innerHTML =
    `<div id="empty-state"><div class="icon">💬</div><p>Select a model and start chatting</p></div>`;
  document.getElementById('usage-bar').style.display = 'none';
}

// ── Send ──────────────────────────────────────────────
async function sendMessage() {
  if (isStreaming || !selectedModel) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = '';

  // Remove empty state
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();

  messages.push({ role: 'user', content: text });
  appendMessage('user', text);

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;

  const assistantEl = appendMessage('assistant', '', selectedModel);
  const bubble = assistantEl.querySelector('.bubble .body');
  bubble.classList.add('cursor');

  try {
    const system = document.getElementById('system-prompt').value.trim();
    const useCache = document.getElementById('cache-toggle').checked;

    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: selectedModel,
        messages: messages.slice(0, -1).concat({ role: 'user', content: text }),
        system,
        use_cache: useCache
      })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') continue;
        try {
          const ev = JSON.parse(raw);
          if (ev.type === 'text') {
            fullText += ev.text;
            bubble.textContent = fullText;
            scrollToBottom();
          } else if (ev.type === 'usage') {
            updateUsage(ev.usage);
          } else if (ev.type === 'error') {
            showError(ev.error);
            bubble.textContent = '⚠ ' + ev.error;
          }
        } catch {}
      }
    }

    bubble.classList.remove('cursor');
    if (fullText) messages.push({ role: 'assistant', content: fullText });

  } catch (err) {
    showError(err.message);
    bubble.classList.remove('cursor');
    bubble.textContent = '⚠ Connection error';
  }

  isStreaming = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}

// ── DOM helpers ──────────────────────────────────────
function appendMessage(role, text, modelId) {
  const msgs = document.getElementById('messages');
  const m = models.find(x => x.id === modelId);
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
    <div class="bubble">
      ${role === 'assistant' && m ? `<div class="model-tag">${m.name}</div>` : ''}
      <span class="body">${escHtml(text)}</span>
    </div>`;
  msgs.appendChild(div);
  scrollToBottom();
  return div;
}

function updateUsage(u) {
  const bar = document.getElementById('usage-bar');
  bar.style.display = 'flex';
  document.getElementById('u-in').textContent = `In: ${fmtN(u.input_tokens)}`;
  document.getElementById('u-out').textContent = `Out: ${fmtN(u.output_tokens)}`;
  const cached = document.getElementById('u-cached');
  if (u.cache_read_input_tokens > 0) {
    cached.style.display = '';
    cached.textContent = `Cache hit: ${fmtN(u.cache_read_input_tokens)}`;
  } else {
    cached.style.display = 'none';
  }
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function autoResize(el) {
  el.style.height = '';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function fmtN(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return String(n);
}

function showError(msg) {
  const t = document.getElementById('error-toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 4000);
}

init();
</script>
</body>
</html>
